name: Build Mobile APK & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-mobile-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cài đặt dependencies từ thư mục gốc của Monorepo
      - name: Install Monorepo dependencies
        run: npm install

      # Tạo file .env trong apps/mobile với đầy đủ biến Firebase và Google OAuth
      - name: Create .env file for mobile
        working-directory: apps/mobile
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EOF

      # Sinh thư mục android từ cấu hình Expo
      - name: Expo Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive

      # Nạp Keystore cố định, kiểm tra nhanh bằng keytool và cấu hình signing cho Release APK
      - name: Restore & Configure Signing Keystore
        working-directory: apps/mobile/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore

          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-${ANDROID_KEY_PASSWORD:-android}}"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-androiddebugkey}"

          # Kiểm tra keystore ngay trước khi build (fail trong 5 giây nếu sai pass/alias)
          keytool -list -keystore release.keystore -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null
          echo "Verified keystore alias '$KEY_ALIAS' successfully."

          # Cập nhật signingConfigs trong build.gradle để đọc trực tiếp từ env
          node -e '
            const fs = require("fs");
            const file = "build.gradle";
            let src = fs.readFileSync(file, "utf8");
            const next = src
              .replace(/storeFile\s+file\([\x27"]debug\.keystore[\x27"]\)/g, "storeFile file(\x27release.keystore\x27)")
              .replace(/storePassword\s+[\x27"]android[\x27"]/g, "storePassword System.getenv(\x27ANDROID_KEYSTORE_PASSWORD\x27) ?: (System.getenv(\x27ANDROID_KEY_PASSWORD\x27) ?: \x27android\x27)")
              .replace(/keyAlias\s+[\x27"]androiddebugkey[\x27"]/g, "keyAlias System.getenv(\x27ANDROID_KEY_ALIAS\x27) ?: \x27androiddebugkey\x27")
              .replace(/keyPassword\s+[\x27"]android[\x27"]/g, "keyPassword System.getenv(\x27ANDROID_KEY_PASSWORD\x27) ?: (System.getenv(\x27ANDROID_KEYSTORE_PASSWORD\x27) ?: \x27android\x27)");
            if (next === src) {
              console.error("Failed to patch signingConfigs in build.gradle");
              process.exit(1);
            }
            fs.writeFileSync(file, next);
          '

      # Biên dịch ra file Release APK
      - name: Build Release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Đổi tên file APK kèm mã commit để dễ phân biệt
      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk Raku-Mobile-${SHORT_SHA}.apk
          echo "APK_NAME=Raku-Mobile-${SHORT_SHA}.apk" >> $GITHUB_ENV

      # Đẩy lên GitHub Releases kèm link tải trực tiếp
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.${{ github.run_number }}
          name: Raku Mobile v1.0.${{ github.run_number }}
          body: |
            Bản build tự động từ commit `${{ github.sha }}`.
            
            **Link tải trực tiếp file cài đặt (APK):**
            https://github.com/${{ github.repository }}/releases/download/mobile-v1.0.${{ github.run_number }}/${{ env.APK_NAME }}
          files: ${{ env.APK_NAME }}
